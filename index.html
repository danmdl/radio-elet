<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Elet Radio Vida FM 99.3</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #5cdd5c;
      --green-dark: #3ab03a;
      --green-glow: #5cdd5c66;
      --bg: #0d0d0d;
      --bg2: #141414;
      --bg3: #1a1a1a;
      --text: #f0f0f0;
      --muted: #888;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      overflow-x: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(92,221,92,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(92,221,92,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial glow behind player */
    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(92,221,92,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.8s;
    }

    body.playing::after {
      background: radial-gradient(circle, rgba(92,221,92,0.14) 0%, transparent 70%);
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 48px;
    }

    /* --- LOGO --- */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      animation: fadeDown 0.8s ease both;
    }

    .logo-wrap img {
      width: 220px;
      max-width: 60vw;
      filter: drop-shadow(0 0 24px rgba(92,221,92,0.3));
    }

    /* --- PLAYER CARD --- */
    .player-card {
      background: var(--bg2);
      border: 1px solid rgba(92,221,92,0.15);
      border-radius: 20px;
      padding: 40px 48px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      animation: fadeUp 0.8s 0.2s ease both;
      box-shadow: 0 8px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    /* Status / now playing */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Oswald', sans-serif;
      font-weight: 300;
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.4s;
      flex-shrink: 0;
    }

    body.playing .dot {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse-dot 1.5s infinite;
    }

    body.playing .status-bar {
      color: var(--green);
    }

    .status-text { transition: color 0.4s; }

    /* Big play button */
    .play-btn {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px solid var(--green);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s, box-shadow 0.25s, transform 0.15s;
      position: relative;
      outline: none;
    }

    .play-btn:hover {
      background: rgba(92,221,92,0.1);
      box-shadow: 0 0 30px var(--green-glow);
      transform: scale(1.05);
    }

    .play-btn:active { transform: scale(0.97); }

    body.playing .play-btn {
      background: var(--green);
      box-shadow: 0 0 40px var(--green-glow);
    }

    .play-btn svg {
      width: 32px;
      height: 32px;
      fill: var(--green);
      transition: fill 0.25s;
      /* offset icon visually center */
      margin-left: 4px;
    }

    body.playing .play-btn svg {
      fill: #0d0d0d;
      margin-left: 0;
    }

    /* Waveform visualizer (CSS only, decorative) */
    .wave {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 32px;
    }

    .wave span {
      display: block;
      width: 4px;
      border-radius: 2px;
      background: rgba(92,221,92,0.25);
      height: 8px;
      transition: background 0.4s;
    }

    body.playing .wave span {
      background: var(--green);
      animation: bar 1.2s ease-in-out infinite;
    }

    .wave span:nth-child(1)  { animation-delay: 0s;    --h: 14px; }
    .wave span:nth-child(2)  { animation-delay: 0.1s;  --h: 24px; }
    .wave span:nth-child(3)  { animation-delay: 0.2s;  --h: 32px; }
    .wave span:nth-child(4)  { animation-delay: 0.15s; --h: 20px; }
    .wave span:nth-child(5)  { animation-delay: 0.05s; --h: 28px; }
    .wave span:nth-child(6)  { animation-delay: 0.25s; --h: 16px; }
    .wave span:nth-child(7)  { animation-delay: 0.1s;  --h: 24px; }
    .wave span:nth-child(8)  { animation-delay: 0.3s;  --h: 12px; }
    .wave span:nth-child(9)  { animation-delay: 0.05s; --h: 28px; }
    .wave span:nth-child(10) { animation-delay: 0.2s;  --h: 20px; }
    .wave span:nth-child(11) { animation-delay: 0.15s; --h: 32px; }
    .wave span:nth-child(12) { animation-delay: 0.0s;  --h: 16px; }

    @keyframes bar {
      0%, 100% { height: 8px; }
      50%       { height: var(--h); }
    }

    /* Volume */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .vol-icon { color: var(--muted); flex-shrink: 0; }

    input[type=range] {
      -webkit-appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--bg3);
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green-glow);
      cursor: pointer;
    }

    /* --- FOOTER --- */
    .footer {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-align: center;
      animation: fadeUp 0.8s 0.4s ease both;
    }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* Mobile tweaks */
    @media (max-width: 480px) {
      .player-card { padding: 32px 28px; }
      .logo-wrap img { width: 180px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="logo-wrap">
      <img src="elet_transpa.png" alt="Elet Radio Vida FM 99.3" />
    </div>

    <div class="player-card">

      <div class="status-bar">
        <span class="dot"></span>
        <span class="status-text" id="statusText">En vivo · FM 99.3</span>
      </div>

      <button class="play-btn" id="playBtn" aria-label="Reproducir">
        <!-- Play icon -->
        <svg id="iconPlay" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <!-- Pause icon (hidden by default) -->
        <svg id="iconPause" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none; margin-left:0;">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
      </button>

      <div class="wave">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <div class="volume-row">
        <svg class="vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        </svg>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
      </div>

    </div>

    <div class="footer">
      Radio Vida · Ministerios Jesucristo es Amor
    </div>

  </div>

  <audio id="audioEl" preload="none">
    <source src="https://cdn.instream.audio:2020/9858/stream" type="audio/mpeg" />
  </audio>

  <script>
    const audio   = document.getElementById('audioEl');
    const btn     = document.getElementById('playBtn');
    const iconPlay  = document.getElementById('iconPlay');
    const iconPause = document.getElementById('iconPause');
    const statusText = document.getElementById('statusText');
    const volSlider = document.getElementById('volume');

    audio.volume = parseFloat(volSlider.value);

    let isPlaying = false;

    btn.addEventListener('click', () => {
      if (!isPlaying) {
        audio.play().then(() => {
          isPlaying = true;
          document.body.classList.add('playing');
          iconPlay.style.display  = 'none';
          iconPause.style.display = 'block';
          statusText.textContent  = '● En vivo ahora · FM 99.3';
        }).catch(err => {
          console.error('Error al reproducir:', err);
          statusText.textContent = 'Error al conectar…';
        });
      } else {
        audio.pause();
        audio.src = audio.src; // reset buffer
        isPlaying = false;
        document.body.classList.remove('playing');
        iconPlay.style.display  = 'block';
        iconPause.style.display = 'none';
        statusText.textContent  = 'En vivo · FM 99.3';
      }
    });

    volSlider.addEventListener('input', () => {
      audio.volume = parseFloat(volSlider.value);
    });
  </script>
</body>
</html>
